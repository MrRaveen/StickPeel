session_name: stickpeel
start_directory: ./
windows:
  - window_name: root
    start_directory: ./
    panes:
      - blank
  - window_name: api
    layout: even-vertical
    start_directory: ./api
    panes:
      - uv run fastapi dev --reload-dir app
      - blank
  - window_name: site
    layout: even-vertical
    start_directory: ./site
    panes:
      - npm run dev -- --port 3000 --strictPort
      - blank
  - window_name: app
    layout: even-vertical
    start_directory: ./app
    panes:
      - npm run dev -- --port 3001 --strictPort
      - blank
  - window_name: internal
    layout: even-vertical
    start_directory: ./internal
    panes:
      - npm run dev -- --port 3002 --strictPort
      - blank


